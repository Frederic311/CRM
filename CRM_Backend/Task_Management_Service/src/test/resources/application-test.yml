spring:
  datasource:
    # In-memory database for the contextLoads() smoke test, in MySQL
    # compatibility mode. The previous version of that test needed a live MySQL
    # on localhost:3306 and failed on every machine without one.
    url: jdbc:h2:mem:crm-task-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  cloud:
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false

  eureka:
    client:
      enabled: false
      register-with-eureka: false
      fetch-registry: false

logging:
  level:
    root: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.deprecation: ERROR