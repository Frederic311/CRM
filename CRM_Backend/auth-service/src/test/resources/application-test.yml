spring:
  datasource:
    # In-memory database for the contextLoads() smoke test, in MySQL
    # compatibility mode. The previous version of that test needed a live MySQL
    # on localhost:3306 and failed on every machine without one.
    url: jdbc:h2:mem:crm-auth-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    # The migration is MySQL specific, using SET @var and PREPARE, so it cannot
    # run on H2. The schema comes from ddl-auto instead.
    enabled: false

  cloud:
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false

  eureka:
    client:
      enabled: false
      register-with-eureka: false
      fetch-registry: false

  mail:
    host: localhost
    port: 3025
    username: test
    password: test

logging:
  level:
    root: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.deprecation: ERROR

application:
  security:
    jwt:
      # Base64 decoding to 32 bytes, which is the minimum Keys.hmacShaKeyFor
      # accepts for the HMAC-SHA signature used on the tokens.
      secret-key: AasC/DCevWRDibxpDg4rCUcIRPeqq0qdigWfOSE8MiU=
      expiration: 86400000
  mailing:
    frontend:
      # Both keys are declared here rather than left to application-dev.yml,
      # which is not loaded under the "test" profile: without them the context
      # cannot start. The values match the defaults in application-dev.yml, and
      # AuthApi1ApplicationTests.bothMailedUrlsAreReadFromConfiguration is what
      # keeps the two from drifting apart again.
      activation-url: http://localhost:4200/login
      reset-password-url: http://localhost:4200/forget-password
  bootstrap:
    admin:
      # No account is created during the tests. Seeding an administrator with a
      # fixed password is what the production code used to do.
      enabled: false