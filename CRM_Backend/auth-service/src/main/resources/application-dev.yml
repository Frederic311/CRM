spring:
  config:
    import: optional:file:.env[.properties],optional:file:../../.env[.properties]

  datasource:
    url: jdbc:mysql://localhost:3306/authdb?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  flyway:
    enabled: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB



  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/
      instance:
        prefer-ip-address: true
        leaseRenewalIntervalInSeconds: 30
        leaseExpirationDurationInSeconds: 90
      registration:
        enabled: true




  #  mail:
  #    host: localhost
  #    port: 1025
  #    username: kamdem
  #    password: 1234
  #    properties:
  #      mail.smtp.ssl.trust: "*"
  #      mail.smtp.auth: true
  #      mail.smtp.starttls.enable: true
  #      mail.smtp.connectiontimeout: 5000
  #      mail.smtp.timeout: 3000
  #      mail.smtp.writetimeout: 5000

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.ssl.trust: smtp.gmail.com
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 5000



logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type: TRACE

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:change-me-in-env}
      expiration: 8640000
  mailing:
    frontend:
      # Where the links in the emails point. Both defaults have to match a
      # route that Front/CRM/src/app/app.routes.ts actually declares. That file
      # ends with a catch-all redirecting to the login page, so a wrong path
      # sends the reader to the login screen with no error at all, which is why
      # "/avtivate-account" and "/resertUrl" went unnoticed.
      #
      # The activation mail delivers a temporary password, so signing in is the
      # next step. A deployment that has a real activation page should point
      # this elsewhere.
      activation-url: ${ACTIVATION_URL:http://localhost:4200/login}
      # The reset mail carries a token that has to be entered on the
      # forget-password page, the only route that accepts one.
      reset-password-url: ${RESET_PASSWORD_URL:http://localhost:4200/forget-password}
