  #      mail.smtp.connectiontimeout: 5000
  #      mail.smtp.timeout: 3000
  #      mail.smtp.writetimeout: 5000

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.ssl.trust: smtp.gmail.com
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 5000



logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type: TRACE

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:change-me-in-env}
      expiration: 8640000
  mailing:
    frontend:
      activation-url : http://localhost:4200/avtivate-account
      resetUrl : http://localhost:4200/resertUrl
