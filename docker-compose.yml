# ─────────────────────────────────────────────────────────────────────────────
# Every variable below uses the ${VAR:-default} form on purpose.
#
# With a bare ${VAR}, Compose substitutes an empty string when the variable is
# unset, and an empty value overrides whatever default the application declares.
# That is how JWT_SECRET_KEY used to reach the container as "" and turn the
# first login into a WeakKeyException.
#
# Required values have no default, so an unset variable fails here with a clear
# message instead of failing later inside a service.
# See .env.example for the full list.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── MySQL Database ─────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: crm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env - see .env.example}
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - crm-network

  # ── Service Discovery (Eureka) ─────────────────────────────────────────────
  service-discovery:
    build:
      context: ./CRM_Backend/service-discovery
    container_name: crm-service-discovery
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health 2>/dev/null | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks:
      - crm-network

  # ── Auth Service ───────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./CRM_Backend/auth-service
    container_name: crm-auth-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/authdb?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-user-service}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env - see .env.example}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env - generate one with node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"}
      FILE_UPLOAD_DIR: /data/uploads
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME must be set in .env - see .env.example}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD must be set in .env - see .env.example}
      EUREKA_SERVICE_URL: http://service-discovery:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    networks:
      - crm-network

  # ── Student Management Service ─────────────────────────────────────────────
  student-service:
    build:
      context: ./CRM_Backend/Student_Management_Service
    container_name: crm-student-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/candidate?createDatabaseIfNotExist=true&maxAllowedPacket=16777216
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-user-service}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env - see .env.example}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      # DocumentService writes to this directory. Without a volume the uploads
      # are lost whenever the container is recreated.
      UPLOAD_DIR: /data/uploads
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME must be set in .env - see .env.example}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD must be set in .env - see .env.example}
    volumes:
      - uploads-data:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    networks:
      - crm-network

  # ── Task Management Service ────────────────────────────────────────────────
  task-service:
    build:
      context: ./CRM_Backend/Task_Management_Service
    container_name: crm-task-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/task?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-user-service}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env - see .env.example}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    networks:
      - crm-network

  # ── Notification Service ───────────────────────────────────────────────────
  notification-service:
    build:
      context: ./CRM_Backend/Notification_Service
    container_name: crm-notification-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME must be set in .env - see .env.example}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD must be set in .env - see .env.example}
      # Twilio is optional. Its client throws from @PostConstruct when the
      # account SID is missing, which stops the service from starting, so an
      # unset value is tolerated instead of injected as an empty string.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
    depends_on:
      service-discovery:
        condition: service_healthy
    networks:
      - crm-network

  # ── Event Management Service ───────────────────────────────────────────────
  event-service:
    build:
      context: ./CRM_Backend/Event_Management_System
    container_name: crm-event-service
    restart: unless-stopped
    ports:
      - "8089:8089"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/event_system?createDatabaseIfNotExist=true&maxAllowedPacket=16777216
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-user-service}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env - see .env.example}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    networks:
      - crm-network

  # ── API Gateway ────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./CRM_Backend/api-gateway
    container_name: crm-api-gateway
    restart: unless-stopped
    ports:
      - "8060:8060"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-discovery:8761/eureka/
      SPRING_CLOUD_GATEWAY_GLOBALCORS_CORSCONFIGURATIONS_[/**]_ALLOWEDORIGINS: ${CORS_ALLOWED_ORIGIN:-http://localhost:4200}
    depends_on:
      service-discovery:
        condition: service_healthy
    networks:
      - crm-network

  # ── Angular Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./Front/CRM
    container_name: crm-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api-gateway
    networks:
      - crm-network

networks:
  crm-network:
    driver: bridge

volumes:
  mysql-data:
  uploads-data:
